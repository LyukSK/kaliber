name: Novinky a nasadenie

on:
  push:
    branches: [main]
  schedule:
    # Každé ráno o 5:00 UTC (7:00 v lete, 6:00 v zime)
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: web
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.nasadenie.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Spracovať novinky
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm run novinky
          if ! git diff --quiet src/data/novinky.json; then
            git config user.name "Kaliber"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/novinky.json
            git commit -m "Novinky $(date -u +%Y-%m-%d)"
            git push
          fi

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: nasadenie
        uses: actions/deploy-pages@v4
