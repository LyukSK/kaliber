name: Novinky a nasadenie

on:
  push:
    branches: [main]
  schedule:
    # Novinky každé ráno o 5:00 UTC (7:00 v lete, 6:00 v zime)
    - cron: '0 5 * * *'
    # Návrhy hodiniek každý pondelok o 6:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      uloha:
        description: Čo spustiť
        type: choice
        options: [novinky, navrhy, oboje]
        default: oboje

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: web
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.nasadenie.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Spracovať novinky
        if: github.event.schedule == '0 5 * * *' || (github.event_name == 'workflow_dispatch' && inputs.uloha != 'navrhy')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run novinky

      - name: Pripraviť návrhy hodiniek
        if: github.event.schedule == '0 6 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.uloha != 'novinky')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run navrhy

      - name: Uložiť zmeny dát
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet src/data; then
            git config user.name "Kaliber"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data
            git commit -m "Aktualizácia dát $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: nasadenie
        uses: actions/deploy-pages@v4
